<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yaswanth — Smart Ring Hero</title>
  <meta name="description" content="Yaswanth wellness smart ring landing hero. Editorial product showcase with continuous tracking and health insights." />

  <!-- Google Fonts: Plus Jakarta Sans (Neo-grotesk UI/copy) & Outfit (Light geometric display for metric numerals) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       1. VARIABLES & SCALING ARCHITECTURE
       --s is reference pixel of 2048x1152 artboard, desktop floor 0.55px
       ========================================================================== */
    :root {
      --s: max(0.55px, min(calc(100vw / 2048), calc(100vh / 1152)));
      
      /* Colors */
      --color-page: #CBCFB8;
      --color-ink-forest: #1E3227;
      --color-ink-sub: #3F5447;
      --color-accent-gold: #9B8A3E;
      --color-cart-moss: rgba(62, 86, 70, 0.52);
      --color-card-fill: rgba(235, 238, 222, 0.44);
      --color-card-border: rgba(30, 50, 39, 0.14);
      --color-glass-arc-border: rgba(255, 255, 255, 0.38);

      /* Typography */
      --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-display: 'Outfit', 'Plus Jakarta Sans', sans-serif;
    }

    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--color-page);
      color: var(--color-ink-forest);
      font-family: var(--font-ui);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      outline: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ==========================================================================
       2. HERO STAGE (Single screen, fills viewport, no letterbox)
       ========================================================================== */
    .hero-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(var(--s) * 44) calc(var(--s) * 64);
      background-color: var(--color-page);
    }

    /* ==========================================================================
       3. BACKGROUND VISUAL: HAND, RING, GLASS ARC & SEAMLESS VIDEO
       Anchored to bottom, leaves frame at bottom edge
       ========================================================================== */
    .stage-media-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* Ultrawide fade masks so video sides dissolve into sage */
    .stage-media-inner {
      position: relative;
      width: 100%;
      max-width: calc(100vh * 2.05); /* stops growing on ultrawide */
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
    }

    /* Thin clear glass circle arc behind the hand */
    .glass-arc {
      position: absolute;
      left: 50%;
      bottom: calc(var(--s) * 60);
      transform: translateX(-50%);
      width: calc(var(--s) * 820);
      height: calc(var(--s) * 820);
      border-radius: 50%;
      border: calc(var(--s) * 1.5) solid var(--color-glass-arc-border);
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(203, 207, 184, 0.12) 65%, rgba(255, 255, 255, 0.22) 100%);
      backdrop-filter: blur(calc(var(--s) * 4));
      -webkit-backdrop-filter: blur(calc(var(--s) * 4));
      z-index: 2;
    }

    /* Fallback high-fidelity photo placeholder */
    .stage-photo {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 100%;
      width: auto;
      min-width: 100%;
      object-fit: cover;
      object-position: center bottom;
      z-index: 3;
    }

    /* Twin crossfading video elements */
    .hero-video {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 100%;
      width: auto;
      min-width: 100%;
      object-fit: cover;
      object-position: center bottom;
      z-index: 4;
      opacity: 0;
      transition: opacity 0.8s ease-out;
    }

    /* Olive-leaf shadow ambient texture overlay */
    .leaf-shadows-layer {
      position: absolute;
      right: 0;
      top: 0;
      width: 55%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(ellipse at 85% 35%, rgba(30, 50, 39, 0.08) 0%, transparent 68%);
      mix-blend-mode: multiply;
    }

    /* ==========================================================================
       4. HEADER (Left: Logo + Yaswanth, Centre: Nav, Right: Cart + Shop pill)
       ========================================================================== */
    .hero-header {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    /* Left: Brand */
    .brand-wrap {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--s) * 14);
      user-select: none;
    }

    .brand-logo-svg {
      width: calc(var(--s) * 42);
      height: calc(var(--s) * 42);
      color: var(--color-ink-forest);
      flex-shrink: 0;
    }

    .brand-name {
      font-size: calc(var(--s) * 35);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--color-ink-forest);
      line-height: 1;
    }

    /* Centre: Nav links at 22s */
    .nav-links {
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 48);
    }

    .nav-link {
      font-size: calc(var(--s) * 22);
      font-weight: 500;
      color: var(--color-ink-forest);
      letter-spacing: -0.015em;
      position: relative;
      transition: opacity 0.2s ease;
    }

    .nav-link:hover {
      opacity: 0.72;
    }

    /* Right: Cart pill + Dark CTA pill */
    .header-actions {
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 16);
    }

    .cart-pill {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--s) * 10);
      padding: calc(var(--s) * 12) calc(var(--s) * 22);
      border-radius: 9999px;
      background-color: var(--color-cart-moss);
      backdrop-filter: blur(calc(var(--s) * 12));
      -webkit-backdrop-filter: blur(calc(var(--s) * 12));
      color: #FFFFFF;
      font-size: calc(var(--s) * 17);
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .cart-pill:hover {
      background-color: rgba(50, 72, 58, 0.68);
      transform: translateY(-1px);
    }

    .cart-icon-svg {
      width: calc(var(--s) * 18);
      height: calc(var(--s) * 18);
    }

    .cart-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: calc(var(--s) * 18);
      height: calc(var(--s) * 18);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      font-size: calc(var(--s) * 12);
      font-weight: 700;
    }

    .shop-pill {
      display: inline-flex;
      align-items: center;
      padding: calc(var(--s) * 13) calc(var(--s) * 28);
      border-radius: 9999px;
      background-color: var(--color-ink-forest);
      color: #F4F6EA;
      font-size: calc(var(--s) * 17);
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .shop-pill:hover {
      background-color: #14231b;
      transform: translateY(-1px);
    }

    /* Mobile hamburger toggle (hidden above 820px) */
    .mobile-menu-btn {
      display: none;
      width: calc(var(--s) * 52);
      height: calc(var(--s) * 52);
      border-radius: 50%;
      background: var(--color-cart-moss);
      backdrop-filter: blur(calc(var(--s) * 10));
      -webkit-backdrop-filter: blur(calc(var(--s) * 10));
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      z-index: 30;
    }

    /* ==========================================================================
       5. MAIN CONTENT ROW: COPY (LEFT) & METRICS (RIGHT)
       Vertically centred, hand in the center stage
       ========================================================================== */
    .hero-body {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: calc(var(--s) * 560) 1fr calc(var(--s) * 250);
      align-items: center;
      width: 100%;
      height: 100%;
      pointer-events: none; /* allows clicking background while keeping text/cards interactive */
    }

    /* 5A. COPY COLUMN (LEFT) */
    .hero-copy {
      pointer-events: auto;
      max-width: calc(var(--s) * 540);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-top: calc(var(--s) * -20);
    }

    /* Eyebrow */
    .eyebrow-wrap {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--s) * 10);
      margin-bottom: calc(var(--s) * 22);
    }

    .status-dot-frame {
      width: calc(var(--s) * 10);
      height: calc(var(--s) * 10);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-dot {
      width: calc(var(--s) * 8);
      height: calc(var(--s) * 8);
      border-radius: 50%;
      background-color: #2F9E58;
      box-shadow: 0 0 calc(var(--s) * 8) rgba(47, 158, 88, 0.45);
    }

    .eyebrow-text {
      font-size: calc(var(--s) * 17);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--color-ink-sub);
    }

    /* Headline: two lines at 69s with overflow masks for entrance rise */
    .headline-mask {
      overflow: hidden;
      display: block;
    }

    .headline-line {
      display: block;
      font-size: calc(var(--s) * 69);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: var(--color-ink-forest);
    }

    /* Paragraph */
    .copy-paragraph {
      margin-top: calc(var(--s) * 28);
      font-size: calc(var(--s) * 20);
      line-height: 1.5;
      color: var(--color-ink-sub);
      font-weight: 450;
      letter-spacing: -0.015em;
      max-width: calc(var(--s) * 480);
    }

    /* CTA Button */
    .cta-button {
      margin-top: calc(var(--s) * 36);
      display: inline-flex;
      align-items: center;
      gap: calc(var(--s) * 12);
      padding: calc(var(--s) * 18) calc(var(--s) * 38);
      border-radius: 9999px;
      background-color: var(--color-ink-forest);
      color: #F4F6EA;
      font-size: calc(var(--s) * 19);
      font-weight: 600;
      letter-spacing: -0.015em;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .cta-button:hover {
      background-color: #122119;
      transform: translateY(-2px);
    }

    .cta-arrow {
      width: calc(var(--s) * 16);
      height: calc(var(--s) * 16);
      stroke-width: 2.2;
    }

    /* 5B. CENTER STAGE (Spacer for hand & ring) */
    .hero-center-spacer {
      pointer-events: none;
      height: 100%;
    }

    /* 5C. METRICS COLUMN (RIGHT): 3 Frosted Glass Cards (222x160s, 20s radius) */
    .hero-metrics {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: calc(var(--s) * 22);
      justify-self: end;
      margin-top: calc(var(--s) * -10);
    }

    .metric-card {
      position: relative;
      width: calc(var(--s) * 222);
      height: calc(var(--s) * 160);
      border-radius: calc(var(--s) * 20);
      background: var(--color-card-fill);
      border: 1px solid var(--color-card-border);
      backdrop-filter: blur(calc(var(--s) * 18));
      -webkit-backdrop-filter: blur(calc(var(--s) * 18));
      padding: calc(var(--s) * 22) calc(var(--s) * 24);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: none; /* Rule: no drop shadows added */
      transition: border-color 0.25s ease, background-color 0.25s ease;
    }

    .metric-card:hover {
      border-color: rgba(30, 50, 39, 0.28);
      background: rgba(235, 238, 222, 0.58);
    }

    /* Card Top: Label & Line Icon */
    .metric-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .metric-label {
      font-size: calc(var(--s) * 13);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-ink-sub);
    }

    .metric-icon-svg {
      width: calc(var(--s) * 18);
      height: calc(var(--s) * 18);
      stroke: var(--color-ink-sub);
      stroke-width: 1.8;
      opacity: 0.85;
    }

    /* Card Center/Bottom: Large light numeral & uppercase sub-label */
    .metric-body {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .metric-numeral {
      font-family: var(--font-display);
      font-size: calc(var(--s) * 38);
      font-weight: 350;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--color-ink-forest);
    }

    .metric-sublabel {
      font-size: calc(var(--s) * 13);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-ink-sub);
    }

    /* Olive gold accent for GOOD and KCAL */
    .metric-sublabel.accent-gold {
      color: var(--color-accent-gold);
    }

    /* ==========================================================================
       6. MOBILE / TABLET OVERLAY MENU (< 820px)
       ========================================================================== */
    .mobile-menu-drawer {
      position: fixed;
      inset: 0;
      background: rgba(203, 207, 184, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 28px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .mobile-menu-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-menu-drawer .nav-link {
      font-size: 24px;
      font-weight: 600;
    }

    .mobile-close-btn {
      position: absolute;
      top: 32px;
      right: 32px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--color-ink-forest);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================================
       7. RESPONSIVE BREAKPOINTS
       ========================================================================== */

    /* Landscape below 1200px: fluid 3-zone grid (copy | hand | cards) */
    @media (max-width: 1200px) and (orientation: landscape) {
      .hero-body {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
      }
      .hero-copy {
        max-width: 100%;
      }
      .headline-line {
        font-size: calc(var(--s) * 60);
      }
    }

    /* Below 820px: header links fold into burger menu */
    @media (max-width: 820px) {
      .nav-links, .header-actions {
        display: none;
      }
      .mobile-menu-btn {
        display: flex;
      }
      .hero-stage {
        padding: 24px 24px;
      }
    }

    /* Portrait: copy first, then 3 cards in a row, hand filling remaining */
    @media (orientation: portrait) {
      .hero-stage {
        padding: 28px 24px 20px 24px;
      }

      .hero-body {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        height: auto;
        flex: 1;
        margin-top: 24px;
        pointer-events: auto;
      }

      .hero-copy {
        max-width: 100%;
        margin-top: 0;
        z-index: 10;
      }

      .headline-line {
        font-size: 42px;
      }

      .copy-paragraph {
        font-size: 16px;
        margin-top: 14px;
        max-width: 100%;
      }

      .cta-button {
        margin-top: 20px;
        padding: 14px 28px;
        font-size: 16px;
      }

      .hero-center-spacer {
        display: none;
      }

      /* Three cards in a horizontal row */
      .hero-metrics {
        flex-direction: row;
        width: 100%;
        justify-content: space-between;
        gap: 10px;
        margin-top: 28px;
        z-index: 10;
      }

      .metric-card {
        flex: 1;
        width: auto;
        height: 120px;
        padding: 14px 16px;
        border-radius: 16px;
      }

      .metric-numeral {
        font-size: 26px;
      }

      .metric-label, .metric-sublabel {
        font-size: 11px;
      }

      /* Hand occupies bottom space */
      .stage-media-wrap {
        height: 60%;
        bottom: 0;
        top: auto;
      }

      .glass-arc {
        width: 380px;
        height: 380px;
        bottom: 20px;
      }
    }

    /* ==========================================================================
       8. REDUCED MOTION (Strict compliance: no entrance, no transitions, no video)
       ========================================================================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .hero-video {
        display: none !important;
      }
      .stage-photo {
        opacity: 1 !important;
      }
    }
  </style>
</head>
<body>

  <!-- MAIN HERO STAGE -->
  <main class="hero-stage">

    <!-- BACKGROUND EDITORIAL HAND & VIDEO LAYER -->
    <div class="stage-media-wrap" aria-hidden="true">
      <div class="stage-media-inner">
        <!-- Thin clear glass circle arcing behind the hand -->
        <div class="glass-arc"></div>

        <!-- High-fidelity photographic base / fallback -->
        <img
          id="heroPhoto"
          class="stage-photo"
          src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/e6d15706-f42b-400d-beda-75840834e8bc.mp4"
          alt="Hand holding rose-gold Yaswanth smart ring with olive-leaf shadows"
        />

        <!-- Twin crossfading video elements for flawless loop -->
        <video
          id="vidA"
          class="hero-video"
          src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/e6d15706-f42b-400d-beda-75840834e8bc.mp4"
          muted
          playsinline
          preload="auto"
        ></video>
        <video
          id="vidB"
          class="hero-video"
          src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/e6d15706-f42b-400d-beda-75840834e8bc.mp4"
          muted
          playsinline
          preload="auto"
        ></video>

        <!-- Ambient olive leaf shadows texture on the right -->
        <div class="leaf-shadows-layer"></div>
      </div>
    </div>

    <!-- HEADER NAVIGATION -->
    <header class="hero-header" id="heroHeader">
      <!-- Left: Six-petal dashed circle logo & "Yaswanth" at 35s -->
      <a href="#" class="brand-wrap" aria-label="Yaswanth Home">
        <svg class="brand-logo-svg" viewBox="0 0 36 36" fill="none">
          <!-- Dashed circular perimeter ring -->
          <circle cx="18" cy="18" r="16.5" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3.4 2.6" />
          <!-- Symmetrical 6-petal rosette -->
          <g transform="translate(18,18)">
            <path d="M0 -11.5 C2.8 -7.5, 2.8 -3.5, 0 0 C-2.8 -3.5, -2.8 -7.5, 0 -11.5Z" fill="currentColor" />
            <path d="M0 -11.5 C2.8 -7.5, 2.8 -3.5, 0 0 C-2.8 -3.5, -2.8 -7.5, 0 -11.5Z" fill="currentColor" transform="rotate(60)" />
            <path d="M0 -11.5 C2.8 -7.5, 2.8 -3.5, 0 0 C-2.8 -3.5, -2.8 -7.5, 0 -11.5Z" fill="currentColor" transform="rotate(120)" />
            <path d="M0 -11.5 C2.8 -7.5, 2.8 -3.5, 0 0 C-2.8 -3.5, -2.8 -7.5, 0 -11.5Z" fill="currentColor" transform="rotate(180)" />
            <path d="M0 -11.5 C2.8 -7.5, 2.8 -3.5, 0 0 C-2.8 -3.5, -2.8 -7.5, 0 -11.5Z" fill="currentColor" transform="rotate(240)" />
            <path d="M0 -11.5 C2.8 -7.5, 2.8 -3.5, 0 0 C-2.8 -3.5, -2.8 -7.5, 0 -11.5Z" fill="currentColor" transform="rotate(300)" />
            <circle cx="0" cy="0" r="2.2" fill="var(--color-page)" />
          </g>
        </svg>
        <span class="brand-name">Yaswanth</span>
      </a>

      <!-- Centre: Links at 22s -->
      <nav class="nav-links" aria-label="Primary Navigation">
        <a href="#technology" class="nav-link">Technology</a>
        <a href="#health" class="nav-link">Health</a>
        <a href="#activity" class="nav-link">Activity</a>
        <a href="#insights" class="nav-link">Insights</a>
      </nav>

      <!-- Right: Cart pill + Dark Shop pill -->
      <div class="header-actions">
        <button class="cart-pill" aria-label="Shopping Cart, 1 item">
          <svg class="cart-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span>Cart</span>
          <span class="cart-count">1</span>
        </button>

        <button class="shop-pill">
          Shop the Ring
        </button>
      </div>

      <!-- Mobile Burger Toggle Button -->
      <button class="mobile-menu-btn" id="burgerBtn" aria-label="Open Navigation Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>

  <!-- VANILLA JAVASCRIPT: ENTRANCE TIMELINE & SEAMLESS VIDEO CROSSFADE -->
  <script>
    (function () {
      'use strict';

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // DOM Elements
      const vidA = document.getElementById('vidA');
      const vidB = document.getElementById('vidB');
      const burgerBtn = document.getElementById('burgerBtn');
      const closeDrawerBtn = document.getElementById('closeDrawerBtn');
      const mobileDrawer = document.getElementById('mobileDrawer');
      const mobileLinks = document.querySelectorAll('.mobile-link');

      // 1. Mobile Menu Drawer logic
      burgerBtn.addEventListener('click', () => mobileDrawer.classList.add('open'));
      closeDrawerBtn.addEventListener('click', () => mobileDrawer.classList.remove('open'));
      mobileLinks.forEach(link => {
        link.addEventListener('click', () => mobileDrawer.classList.remove('open'));
      });

      // 2. Seamless Video Crossfading Engine
      // Plays video A, starts video B with 1.0s crossfade before A ends, so it never jumps or plays in reverse
      if (!prefersReducedMotion && vidA && vidB) {
        let activeVideo = vidA;
        let nextVideo = vidB;
        let isTransitioning = false;
        let hasFadedIn = false;

        const initVideo = (vid) => {
          vid.load();
          vid.play().catch(() => {
            // Autoplay policy fallback: muted video
          });
        };

        const handleInitialFadeIn = () => {
          if (!hasFadedIn) {
            hasFadedIn = true;
            vidA.style.opacity = '1';
          }
        };

        vidA.addEventListener('loadeddata', handleInitialFadeIn);
        vidA.addEventListener('canplay', handleInitialFadeIn);

        const checkCrossfade = () => {
          if (!activeVideo.duration) {
            requestAnimationFrame(checkCrossfade);
            return;
          }

          const timeLeft = activeVideo.duration - activeVideo.currentTime;

          // Crossfade threshold: 1.0s before completion
          if (timeLeft <= 1.0 && !isTransitioning) {
            isTransitioning = true;
            nextVideo.currentTime = 0;
            nextVideo.play().then(() => {
              nextVideo.style.opacity = '1';
              activeVideo.style.opacity = '0';

              setTimeout(() => {
                // Swap active pointers
                const temp = activeVideo;
                activeVideo = nextVideo;
                nextVideo = temp;
                isTransitioning = false;
              }, 950);
            }).catch(() => {
              isTransitioning = false;
            });
          }

          requestAnimationFrame(checkCrossfade);
        };

        initVideo(vidA);
        initVideo(vidB);
        requestAnimationFrame(checkCrossfade);
      }

      // 3. Web Animations API Entrance Timeline
      // Runs once fonts and image/video first frame are ready, then cancels itself so authored CSS takes over
      if (!prefersReducedMotion) {
        const header = document.getElementById('heroHeader');
        const statusDot = document.getElementById('statusDot');
        const eyebrowText = document.getElementById('eyebrowText');
        const line1 = document.getElementById('headlineLine1');
        const line2 = document.getElementById('headlineLine2');
        const para = document.getElementById('copyPara');
        const cta = document.getElementById('ctaBtn');
        const cardSleep = document.getElementById('cardSleep');
        const cardCalories = document.getElementById('cardCalories');
        const cardHrv = document.getElementById('cardHrv');

        const runEntranceAnimation = () => {
          const easeOutCubic = 'cubic-bezier(0.16, 1, 0.3, 1)';
          const easeOutQuart = 'cubic-bezier(0.25, 1, 0.5, 1)';

          // Header drop-in
          header.animate([
            { transform: 'translateY(-30px)', opacity: 0 },
            { transform: 'translateY(0)', opacity: 1 }
          ], { duration: 900, delay: 100, fill: 'backwards', easing: easeOutCubic });

          // Tracking dot switches on with circular clip
          statusDot.animate([
            { clipPath: 'circle(0% at 50% 50%)', opacity: 0, transform: 'scale(0.4)' },
            { clipPath: 'circle(100% at 50% 50%)', opacity: 1, transform: 'scale(1)' }
          ], { duration: 600, delay: 350, fill: 'backwards', easing: easeOutCubic });

          // Eyebrow label follows
          eyebrowText.animate([
            { transform: 'translateX(-12px)', opacity: 0 },
            { transform: 'translateX(0)', opacity: 1 }
          ], { duration: 700, delay: 420, fill: 'backwards', easing: easeOutCubic });

          // Headline Line 1 rises inside mask
          line1.animate([
            { transform: 'translateY(110%)', opacity: 0 },
            { transform: 'translateY(0)', opacity: 1 }
          ], { duration: 1000, delay: 480, fill: 'backwards', easing: easeOutCubic });

          // Headline Line 2 rises inside mask
          line2.animate([
            { transform: 'translateY(110%)', opacity: 0 },
            { transform: 'translateY(0)', opacity: 1 }
          ], { duration: 1000, delay: 620, fill: 'backwards', easing: easeOutCubic });

          // Paragraph settles in
          para.animate([
            { transform: 'translateY(24px)', opacity: 0 },
            { transform: 'translateY(0)', opacity: 1 }
          ], { duration: 900, delay: 780, fill: 'backwards', easing: easeOutCubic });

          // CTA settles in
          cta.animate([
            { transform: 'translateY(20px)', opacity: 0 },
            { transform: 'translateY(0)', opacity: 1 }
          ], { duration: 850, delay: 900, fill: 'backwards', easing: easeOutCubic });

          // Glass cards rise one after another
          [cardSleep, cardCalories, cardHrv].forEach((card, idx) => {
            card.animate([
              { transform: 'translateY(40px)', opacity: 0 },
              { transform: 'translateY(0)', opacity: 1 }
            ], { duration: 950, delay: 650 + (idx * 160), fill: 'backwards', easing: easeOutQuart });
          });
        };

        // Trigger entrance once fonts are ready
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(runEntranceAnimation);
        } else {
          window.addEventListener('DOMContentLoaded', runEntranceAnimation);
        }
      }
    })();
  </script>
